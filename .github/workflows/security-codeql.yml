# =============================================================================
# CodeQL Security Analysis
# Analyzes C/C++ source code for security vulnerabilities
# =============================================================================
name: CodeQL Security Analysis

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "examples/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/security-codeql.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "examples/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/security-codeql.yml"

  workflow_dispatch:

permissions:
  contents: read # Read-only access to repository contents
  security-events: write # Allow upload of CodeQL analysis results to GitHub Security.
  actions: read # Read-only access to GitHub Actions workflow files and logs.

jobs:
  analyze:
    name: CodeQL Analysis (C/C++)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            pkg-config

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-codeql-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-codeql-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: c-cpp
          # security-extended: security alerts only, without code quality noise
          queries: security-extended
          config: |
            paths-ignore:
              - vcpkg/**
              - vcpkg_installed/**
              - build/**
              - third_party/**
              - docs/**
              - tools/**

      - name: Configure CMake
        run: cmake --preset release

      - name: Build for analysis
        run: cmake --build --preset release --parallel

      # Upload SARIF results to GitHub Security.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:c-cpp"
          upload: always
