# =============================================================================
# Code Quality - Static Analysis & Linting
# =============================================================================
name: Code Quality

on:
  pull_request:
    branches: [main]

  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cppcheck:
    name: Cppcheck Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck -j"$(nproc)" \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=cppcheckLimitations \
            --exclude=build \
            --exclude=third_party \
            --exclude=cmake \
            --inline-suppr \
            -I include \
            src/ \
            2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
          retention-days: 14

  codespell:
    name: Spell Checker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          skip: build,_deps,vendor,third_party,vcpkg,cmake,*.lock,*.json,*.es.md
          ignore_words_list: nd,ot,te,ThirdParty,raysim
          check_filenames: true

  quality-gate:
    name: Quality Gate Summary
    needs: [cppcheck, codespell]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate quality checks
        run: |
          {
            echo "### Code Quality Report"
            echo
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Cppcheck | ${{ needs.cppcheck.result }} |"
            echo "| Codespell | ${{ needs.codespell.result }} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.cppcheck.result }}" == "failure" || \
                "${{ needs.codespell.result }}" == "failure" ]]; then
            echo "Some quality checks failed" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::One or more quality checks failed"
            exit 1
          fi

          echo "All quality checks passed" >> "$GITHUB_STEP_SUMMARY"
