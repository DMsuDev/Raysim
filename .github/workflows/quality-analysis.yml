# =============================================================================
# Code Quality - Static Analysis & Linting
# =============================================================================
name: Code Quality

on:
  pull_request:
    branches: [main]

  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: Clang-Tidy Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-tidy clang \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev libwayland-dev \
            libxkbcommon-dev pkg-config

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRS_BUILD_EXAMPLES=ON

      - name: Run clang-tidy
        # Check project headers (include/) for naming conventions and code style
        run: |
          find include \( -name '*.hpp' -o -name '*.h' \) | while read -r header; do
            echo "-> $header"
            clang-tidy "$header" -p build --warnings-as-errors='*'
          done

          echo "Checking source files..."
          find src -name '*.cpp' -print0 | \
          xargs -0 -P"$(nproc)" clang-tidy \
            -p build \
            --warnings-as-errors='*'

  cppcheck:
    name: Cppcheck Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck -j"$(nproc)" \
            --enable=warning,style,performance,portability \
            --std=c++20 \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=cppcheckLimitations \
            --exclude=build \
            --exclude=third_party \
            --exclude=cmake \
            --inline-suppr \
            -I include \
            src/ \
            2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cppcheck-report
          path: cppcheck-report.txt
          retention-days: 14

  codespell:
    name: Spell Checker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: build,_deps,vendor,third_party,vcpkg,cmake,*.lock,*.json,*.es.md
          ignore_words_list: nd,ot,te,ThirdParty,raysim
          check_filenames: true

  quality-gate:
    name: Quality Gate Summary
    needs: [clang-tidy, cppcheck, codespell]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate quality checks
        run: |
          echo "### Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Clang-Tidy | ${{ needs.clang-tidy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cppcheck | ${{ needs.cppcheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Codespell | ${{ needs.codespell.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.clang-tidy.result }}" == "failure" || \
                "${{ needs.cppcheck.result }}" == "failure" || \
                "${{ needs.codespell.result }}" == "failure" ]]; then
            echo "Some quality checks failed" >> $GITHUB_STEP_SUMMARY
            echo "::error::One or more quality checks failed"
            exit 1
          fi

          echo "All quality checks passed" >> $GITHUB_STEP_SUMMARY
