# =============================================================================
# CI Build - Cross-platform (Windows + Linux) compilation with vcpkg
# Uses native shell commands (no third-party actions) for reliability
# =============================================================================
name: CI Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "examples/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/ci-build.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "examples/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.preset }})
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: debug

          - os: ubuntu-latest
            preset: release

          - os: windows-latest
            preset: msvc-debug

          - os: windows-latest
            preset: msvc-release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ===================================================================
      # Install platform-specific dependencies
      # ===================================================================
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            libglu1-mesa-dev libwayland-dev libxkbcommon-dev \
            pkg-config

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/vcpkg_installed
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        # Bootstrap vcpkg package manager
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          fi
        shell: bash

      # Configure CMake with vcpkg toolchain
      - name: Configure CMake
        shell: bash
        run: |
          # shellcheck disable=SC2193
          BUILD_TYPE="Release"
          [[ "${{ matrix.preset }}" == *"debug"* ]] && BUILD_TYPE="Debug"

          echo "BUILD_TYPE=$BUILD_TYPE" >> "$GITHUB_ENV"

          CMAKE_ARGS=(
            -B build
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          )

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            CMAKE_ARGS+=(
              -G Ninja
              -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
            )
          fi

          cmake "${CMAKE_ARGS[@]}"

      - name: Build
        # Build all targets
        run: cmake --build build --config "$BUILD_TYPE" --parallel
        shell: bash

      # Run tests (non-blocking)
      - name: Run basic tests
        run: cmake --build build --target test --config "$BUILD_TYPE"
        continue-on-error: true
        shell: bash
