# =============================================================================
# CI Build - Cross-platform (Windows + Linux) compilation with vcpkg
# Uses native shell commands (no third-party actions) for reliability
# =============================================================================
name: CI Build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "examples/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/ci-build.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "examples/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/ci-build.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: >-
      Build (${{ matrix.os }}, ${{ matrix.preset }})
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            preset: debug

          - os: ubuntu-latest
            preset: release

          - os: windows-latest
            preset: msvc-debug

          - os: windows-latest
            preset: msvc-release

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev \
            pkg-config

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6

      - name: Configure CMake
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"
