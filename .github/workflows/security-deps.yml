# =============================================================================
# Dependency Review - Scan for vulnerable and unlicensed dependencies on PRs
# https://github.com/actions/dependency-review-action
# =============================================================================
name: Dependency Security Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Review Dependencies (Security & Licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependencies for vulnerabilities
        uses: actions/dependency-review-action@v5
        with:
          # Fail on high or critical vulnerabilities (blocks PR merge if required)
          fail-on-severity: high

          # Whitelist permissive/open licenses used by project (GLFW, imgui, spdlog, glm, raylib, etc.)
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Zlib, BSL-1.0, 0BSD, Unlicense, MPL-2.0, GPL-2.0+, GPL-3.0+

          # Always add summary to PR for visibility
          comment-summary-in-pr: always
