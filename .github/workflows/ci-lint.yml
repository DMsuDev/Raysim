name: Lint GitHub Actions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

  workflow_dispatch:

# Minimal permissions needed for actionlint to run and report results.
permissions:
  contents: read

jobs:
  actionlint:
    name: Validate Workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Actionlint
        uses: step-security/action-actionlint@v1
        with:
          actionlint_flags: >-
            -format '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}}%0A```\n{{$err.Snippet}}```\n{{end}}'
