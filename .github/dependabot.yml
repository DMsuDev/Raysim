# =============================================================================
# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot
# =============================================================================
version: 2

updates:
  # =========================================================================
  # GitHub Actions: Keep CI/CD workflows up-to-date
  # =========================================================================
  # Group all updates to reduce noise; let maintainers review together
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"

    open-pull-requests-limit: 2

    pull-request-branch-name:
      separator: "/"

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "ci"
      include: "scope"

    groups:
      # Single PR for all GitHub Actions (less noise)
      github-actions:
        patterns:
          - "*"
